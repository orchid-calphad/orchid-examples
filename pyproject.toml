[project]
name = "orchid-examples"
version = "0"
description = "Runnable ORCHID CALPHAD examples. Each example keeps its own pinned requirements.txt; this project only holds the repository tooling."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false  # not an installable package: the examples are scripts with their own environments

[dependency-groups]
# Repository checks only, pinned to the versions the CI workflow installs (.github/workflows/examples.yml).
dev = [
    "matplotlib==3.10.7",
    "numpy==2.3.2",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 130
force-exclude = true
extend-exclude = ["*.ipynb"]  # the executed quickstart notebook is generated output, not hand-written Python

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "ERA", "F", "FA", "I", "ICN", "N", "PL", "PTH", "Q", "SIM", "TC", "UP", "W"]
ignore = ["E501", "PLR0913", "PLR2004"]  # long lines and magic-value comparisons are judgment calls, not lint failures
pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "double"
