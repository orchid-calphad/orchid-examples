# Quick paths of every example + repository hygiene. Each example gets its own environment from its pinned
# requirements; outputs must regenerate identically (PNG pixel tolerance on Linux, see tests/check_quick_paths.py).
name: examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python tests/check_hygiene.py
      - name: CITATION.cff is valid
        run: pip install cffconvert==2.0.0 && cffconvert --validate
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy==2.3.2" "matplotlib==3.10.7" "pytest==9.1.1"
      - run: python -m pytest -q tests
  quick-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [cuzr-phaseforgeplus, cuzr-espei-mcmc, oneshot-benchmark, mlip-formation-enthalpy, quickstart]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.example }}/requirements.txt
      - name: Pinned environment of the example
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r ${{ matrix.example }}/requirements.txt
      - name: Quick path regenerates the committed outputs
        run: .venv/bin/python tests/check_quick_paths.py ${{ matrix.example }} --pixel-tol 2.0
